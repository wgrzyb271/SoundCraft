# Wpisz klucze i uruchom. Zmienne środowiskowe mają pierwszeństwo przed tym plikiem.
debug: false          # true => panel TUI + log DEBUG

api_keys:
  deepseek: ""        # DEEPSEEK_API_KEY
  huggingface: ""     # HF_TOKEN

env: {}               # dodatkowe zmienne środowiskowe, np. {WANDB_API_KEY: "..."}

deepseek:
  model: deepseek-v4-flash
  thinking: false
  timeout_s: 60

orchestrator:
  classifier: hybrid            # hybrid | llm | rules
  max_failures: 3
  max_attempts_per_agent: 1
  agent_timeout_s: 3600
  postprocessing_timeout_s: 900
  count_unsupported_task: true

paths:
  models_yaml: models.yaml
  user_root: /tmp/orkiestrator_users
  # Ten sam katalog co SFTP_REMOTE_PATH/RSYNC_REMOTE_PATH backendu na WCSS.
  request_root: /home/USER/backend_files

# URL musi być osiągalny z węzła CPU, na którym działa worker WCSS.
# `localhost` laptopa nie jest widoczny z WCSS. Token musi być taki sam jak
# backend.callback_token w konfiguracji laptopa.
callback:
  url: ""
  token: ""
  request_timeout_s: 5
  total_timeout_s: 30
  max_attempts: 4
  retry_base_s: 2

wcss:
  slurm_account: WCSS_ACCOUNT
  slurm_qos: WCSS_ACCOUNT
  slurm_partition: lem-gpu-short
  # Puste = moduł właściwy dla danego agenta (BS: Python 3.10, Demucs/SAM: Python 3.11).
  python_module: ""

agents:
  bs_roformer:
    root: /home/USER/SoundCraft/agent_bs_roformer
    python: python
    config: /home/USER/models/bs_roformer/config.yaml
    checkpoint: /home/USER/models/bs_roformer/model.ckpt
    model_repo: /home/USER/Music-Source-Separation-Training
  demucs:
    python: /home/USER/venvs/demucs/bin/python
    script: /home/USER/SoundCraft/demucs/agent.py
    orchestrator_root: /home/USER/SoundCraft/llm_agent
  sam_audio:
    python: /home/USER/venvs/sam-audio/bin/python
    root: /home/USER/SoundCraft/agent_sam_audio
    model: facebook/sam-audio-base

# Czytane przez SoundCraft_backend po ustawieniu SOUNDCRAFT_CONFIG na ten plik.
backend:
  rsync_host: USER@ui.wcss.pl
  rsync_remote_path: /home/USER/backend_files
  sftp_host: ui.wcss.pl
  sftp_username: USER
  sftp_remote_path: /home/USER/backend_files
  sftp_private_key: /home/local-user/.ssh/id_ed25519
  sftp_port: 22
  processing_ttl: 3600
  callback_token: ""
  completion_wait_timeout: 5400

mcp:
  command: ""         # puste = lokalny stub deploy
  args: []
  env: {}
